<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAT-COMPUTER v4.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="//code.hitc.com.co/a/display.php?r=8985165"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030704;
            --panel-bg: rgba(10, 26, 15, 0.65);
            --neon-green: #00ff66;
            --alert-red: #ff3333;
            --cyber-gold: #ffcc00;
            --text-dim: #5c8a67;
            --border-glow: rgba(0, 255, 102, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Share Tech Mono', monospace;
        }

        body {
            background-color: var(--bg-base);
            color: var(--neon-green);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            overflow-x: hidden;
        }

        .header-bar {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .hero-card {
            width: 100%;
            max-width: 420px;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.05);
            margin-bottom: 12px;
            position: relative;
        }

        .hero-img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(0,255,102,0.3));
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .stat-box {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-glow);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 800;
            color: #fff;
        }

        .btn {
            width: 100%;
            max-width: 420px;
            padding: 14px;
            border: 1px solid var(--neon-green);
            background: rgba(0, 255, 102, 0.1);
            color: var(--neon-green);
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.2s;
        }

        .btn-active {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 15px var(--neon-green);
        }

        #ad-container {
            width: 100%;
            max-width: 420px;
            min-height: 50px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <span>UNIVERSE: DC GOTHAM</span>
        <span style="color: var(--neon-green);">● ONLINE</span>
    </div>

    <div class="hero-card">
        <img class="hero-img" src="https://pngimg.com/uploads/batman/batman_PNG111.png" alt="Batman">
        <div class="stats-grid">
            <div class="stat-box">
                <div style="font-size: 9px; color: var(--text-dim);">SYSTEM CORE</div>
                <div class="stat-val" style="color: var(--neon-green);">ENCRYPTED</div>
            </div>
            <div class="stat-box">
                <div style="font-size: 9px; color: var(--text-dim);">ADS PROCESSED</div>
                <div class="stat-val" id="ad-count">0 NODE</div>
            </div>
        </div>
    </div>

    <button id="start-btn" class="btn" onclick="toggleAutoAds()">AUTO START</button>

    <div id="ad-container"></div>

    <script>
        // Telegram WebApp Safe Init
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        let isRunning = false;
        let adInterval = null;
        let count = 0;

        function toggleAutoAds() {
            const btn = document.getElementById('start-btn');
            
            if (!isRunning) {
                isRunning = true;
                btn.innerText = "OVERDRIVE ACTIVE";
                btn.classList.add('btn-active');
                
                // First Run
                triggerAd();

                // Loop every 10 seconds
                adInterval = setInterval(() => {
                    triggerAd();
                }, 10000);
            } else {
                isRunning = false;
                btn.innerText = "AUTO START";
                btn.classList.remove('btn-active');
                clearInterval(adInterval);
            }
        }

        function triggerAd() {
            count++;
            document.getElementById('ad-count').innerText = count + " NODE";

            // Trigger Monetag Script if available
            if (typeof show_8985165 === 'function') {
                show_8985165();
            }
        }
    </script>
</body>
</html>
