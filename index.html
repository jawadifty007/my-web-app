<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gotham Bat-Computer Node</title>

  <!-- 1. TELEGRAM SDK LOADED FIRST -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg: #020503;
      --card-bg: rgba(6, 20, 11, 0.75);
      --border: #153e22;
      --cyber-main: #22c55e;
      --cyber-glow: rgba(34, 197, 94, 0.4);
      --matrix-light: #4ade80;
      --alert-red: #ef4444;
      --text-white: #f0fdf4;
      --text-muted: #6ee7b7;
    }

    [data-theme="marvel"] {
      --bg: #030814;
      --card-bg: rgba(10, 25, 47, 0.75);
      --border: #1e3a8a;
      --cyber-main: #06b6d4;
      --cyber-glow: rgba(6, 182, 212, 0.4);
      --matrix-light: #38bdf8;
      --alert-red: #f43f5e;
      --text-white: #f0f9ff;
      --text-muted: #7dd3fc;
    }

    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 10%, var(--cyber-glow) 0%, transparent 60%);
      color: var(--text-white);
      padding: 16px;
      min-height: 100vh;
    }

    .container {
      max-width: 480px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 16px;
    }

    .theme-switcher-box {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card-bg); border: 1px solid var(--border);
      padding: 10px 16px; border-radius: 16px; backdrop-filter: blur(10px);
    }

    .theme-title-text { font-size: 0.75rem; font-weight: 800; color: var(--matrix-light); }

    .theme-btn {
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--cyber-main);
      color: var(--text-white); padding: 6px 12px; border-radius: 20px;
      font-size: 0.7rem; font-weight: 900; cursor: pointer;
    }

    .bat-console-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 24px; padding: 20px 18px;
      box-shadow: 0 0 30px var(--cyber-glow);
      display: flex; flex-direction: column; align-items: center;
    }

    .batman-img-box { position: relative; width: 100%; display: flex; justify-content: center; }
    .batman-3d-img { width: 180px; height: 180px; object-fit: contain; z-index: 2; filter: drop-shadow(0 0 20px var(--cyber-glow)); }

    .bat-system-card { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
    .system-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .system-title { font-size: 0.8rem; color: var(--matrix-light); font-weight: 800; }
    .threat-badge { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--alert-red); color: var(--alert-red); font-size: 0.65rem; padding: 3px 8px; border-radius: 6px; font-weight: 800; }

    .radar-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
    .grid-box { background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border); padding: 12px; border-radius: 12px; }
    .grid-label { font-size: 0.65rem; color: var(--text-muted); font-weight: 700; }
    .grid-value { font-size: 1.1rem; font-weight: 900; color: var(--text-white); }

    .ad-watch-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 18px; }
    .ad-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .ad-title-group { display: flex; align-items: center; gap: 12px; }
    .batman-icon-box { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--cyber-main); color: var(--matrix-light); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

    .btn-gradient {
      background: linear-gradient(135deg, var(--cyber-main), var(--matrix-light));
      color: #000; border: none; padding: 12px 18px; border-radius: 14px; font-weight: 900; font-size: 0.8rem; cursor: pointer;
    }
    .btn-gradient.running { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }

    .direct-link-btn {
      width: 100%; background: var(--card-bg); color: var(--matrix-light); border: 1px solid var(--cyber-main);
      border-radius: 18px; padding: 16px; font-size: 0.9rem; font-weight: 900; cursor: pointer;
    }
  </style>
</head>
<body data-theme="dc">

  <div class="container">
    <div class="theme-switcher-box">
      <span class="theme-title-text" id="universe-label">UNIVERSE: DC GOTHAM</span>
      <button class="theme-btn" id="themeToggleBtn"><i class="fa-solid fa-arrows-rotate"></i> SWITCH MARVEL</button>
    </div>

    <div class="bat-console-card">
      <div class="batman-img-box">
        <img src="https://pngimg.com/uploads/batman/batman_PNG111.png" id="hero-img" class="batman-3d-img">
      </div>

      <div class="bat-system-card">
        <div class="system-header">
          <div class="system-title" id="system-title-text">BAT-COMPUTER v4.0</div>
          <div class="threat-badge" id="threat-level">THREAT: HIGH</div>
        </div>

        <div class="radar-grid">
          <div class="grid-box">
            <div class="grid-label">SYSTEM CORE</div>
            <div class="grid-value" style="color: var(--matrix-light); font-size: 0.85rem;">ENCRYPTED 🟢</div>
          </div>
          <div class="grid-box">
            <div class="grid-label">ADS PROCESSED</div>
            <div class="grid-value"><span id="total-completed">0</span> NODE</div>
          </div>
        </div>
      </div>
    </div>

    <div class="ad-watch-card">
      <div class="ad-header">
        <div class="ad-title-group">
          <div class="batman-icon-box" id="node-icon"><i class="fa-solid fa-mask-ventilator"></i></div>
          <div>
            <div style="font-weight: 900; font-size: 0.85rem;" id="node-title">GOTHAM AD SCANNER</div>
            <div style="font-size: 0.75rem; color: var(--text-muted);">SESSION: <span id="session-ads" style="color:#fff;">0</span></div>
          </div>
        </div>
        <button class="btn-gradient" id="start-btn">AUTO START</button>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:0.75rem;">
        <span style="color: var(--matrix-light);" id="sector-text">🏙️ GOTHAM CENTRAL</span>
        <span id="auto-status" style="color: var(--alert-red); font-weight:700;">OFFLINE</span>
      </div>
    </div>

    <button class="direct-link-btn" id="directLinkBtn">🦇 OPEN GOTHAM SECRET VAULT</button>
  </div>

  <script>
    const DIRECT_LINK_URL = "https://omg10.com/4/11467098"; 
    const AD_INTERVAL_SECONDS = 10;

    let totalCompleted = parseInt(localStorage.getItem('totalCompleted')) || 0;
    let sessionAds = 0;
    let autoLoopTimer = null;
    let isRunning = false;
    let lastExecutionTime = 0;
    let tg = window.Telegram?.WebApp || null;

    updateUI();

    function updateUI() {
      document.getElementById('total-completed').innerText = totalCompleted;
      document.getElementById('session-ads').innerText = sessionAds;
      localStorage.setItem('totalCompleted', totalCompleted);
    }

    function runSingleAd() {
      let currentTime = Date.now();
      if (currentTime - lastExecutionTime < 4000) return;
      lastExecutionTime = currentTime;

      // Safe trigger for Monetag Ad
      if (typeof window.show_11339271 === "function") {
        try { 
          window.show_11339271().catch(err => console.log('Ad show error handled')); 
        } catch(e) {}
      }

      totalCompleted += 1;
      sessionAds += 1;
      updateUI();
    }

    document.getElementById('start-btn').addEventListener('click', function() {
      let btn = document.getElementById('start-btn');
      let status = document.getElementById('auto-status');

      if (!isRunning) {
        isRunning = true;
        btn.innerText = "OVERDRIVE";
        btn.classList.add('running');
        status.innerText = "ONLINE ⚡";
        status.style.color = "var(--matrix-light)";

        runSingleAd();
        autoLoopTimer = setInterval(runSingleAd, AD_INTERVAL_SECONDS * 1000);
      } else {
        isRunning = false;
        clearInterval(autoLoopTimer);
        btn.innerText = "AUTO START";
        btn.classList.remove('running');
        status.innerText = "OFFLINE";
        status.style.color = "var(--alert-red)";
      }
    });

    document.getElementById('directLinkBtn').addEventListener('click', function() {
      if (DIRECT_LINK_URL) {
        if (tg && tg.openLink) { tg.openLink(DIRECT_LINK_URL); } 
        else { window.open(DIRECT_LINK_URL, '_blank'); }
      }
    });

    let currentTheme = 'dc';
    document.getElementById('themeToggleBtn').addEventListener('click', function() {
      const body = document.body;
      if (currentTheme === 'dc') {
        currentTheme = 'marvel';
        body.setAttribute('data-theme', 'marvel');
        document.getElementById('hero-img').src = 'https://pngimg.com/uploads/iron_man/iron_man_PNG37.png';
        document.getElementById('universe-label').innerText = 'UNIVERSE: MARVEL STARK';
      } else {
        currentTheme = 'dc';
        body.setAttribute('data-theme', 'dc');
        document.getElementById('hero-img').src = 'https://pngimg.com/uploads/batman/batman_PNG111.png';
        document.getElementById('universe-label').innerText = 'UNIVERSE: DC GOTHAM';
      }
    });

    // SAFELY LOAD MONETAG SDK IN BACKGROUND AFTER PAGE LOADS
    window.addEventListener('load', function() {
      var adScript = document.createElement('script');
      adScript.src = "https://libtl.com/sdk.js";
      adScript.dataset.zone = "11339271";
      adScript.dataset.sdk = "show_11339271";
      adScript.async = true;
      document.body.appendChild(adScript);
    });
  </script>
</body>
  </html>
